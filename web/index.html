<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC Mod Migrator</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><style>.folder-path{flex:1;min-width:0}</style><main><section class="hero"><div class="badge">MIGRATION STUDIO</div><h1>整合包，轻松跨版本。</h1><p>识别模组内部 ID，寻找匹配发布版，并在依赖无法满足时保护你的目标环境。</p><div class="chips"><span>Fabric</span><span>Forge</span><span>NeoForge</span><span>Quilt</span></div></section>
<section class="card setup"><div class="step"><b>01</b><div><label>来源 mods 文件夹</label><div class="picker"><input id="sourcePath" class="folder-path" placeholder="点击浏览或粘贴完整路径" spellcheck="false"><button data-choose="source">浏览…</button></div></div></div><div class="rail"></div><div class="step"><b>02</b><div><label>目标版本与加载器</label><div class="fields"><input id="version" placeholder="例如 1.21.1（可自行输入）" aria-label="目标 Minecraft 版本"><select id="loader"><option value="" selected disabled>选择加载器</option><option value="fabric">Fabric</option><option value="forge">Forge</option><option value="neoforge">NeoForge</option><option value="quilt">Quilt</option></select></div></div></div><div class="rail"></div><div class="step"><b>03</b><div><label>目标 mods 文件夹</label><div class="picker"><input id="targetPath" class="folder-path" placeholder="点击浏览或粘贴完整路径" spellcheck="false"><button data-choose="target">浏览…</button></div></div></div></section>
<section class="toolbar"><div><h2>迁移清单 <em id="count">0</em></h2><p>取消勾选即可排除；加载器核心已锁定。匹配到的配置和快捷键将一并迁移。</p></div><button class="primary" id="migrate" disabled>开始迁移 <span>→</span></button></section>
<details class="advanced"><summary>可选：CurseForge API Key</summary><p>填入后，当 Modrinth 找不到对应发布版时，会继续从 CurseForge 检索并下载。Key 仅保留在当前浏览器内存中。</p><input id="curseKey" type="password" autocomplete="off" placeholder="CurseForge API Key（可留空）"></details>
<section class="card list" id="list"><div class="empty">先选择一个来源文件夹，读取其中的 .jar 模组。</div></section>
<section class="card activity hidden" id="activity"><div class="activity-top"><div><div class="eyebrow">正在处理</div><h2 id="current">准备中…</h2></div><div class="percent" id="percent">0%</div></div><div class="progress"><i id="bar"></i></div><div class="log" id="log"></div></section>
</main><template id="modRow"><div class="mod"><input type="checkbox"><div class="icon"></div><div class="details"><strong></strong><small></small></div><div class="tag"></div><div class="lock"></div></div></template><script src="/assets/app.js"></script></body></html>
